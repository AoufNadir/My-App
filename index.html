<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USDT Tracker</title>

  <!-- PWA Manifest and Meta Tags -->
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0B1120" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ProDigital" />
  <link rel="apple-touch-icon" href="/pwa-icon.png" />
  <link rel="icon" href="/pwa-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Cairo', 'Tajawal', system-ui, sans-serif;
      line-height: 1.5;
      /* Improve font rendering and prevent background scroll on iOS when modals are open */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>

</head>

<body>
  <div id="root"></div>

  <!-- Disable stale app caches while running the Vite dev server locally. -->
  <script>
    const isLocalDevHost = ['localhost', '127.0.0.1', '::1'].includes(window.location.hostname);

    if (isLocalDevHost) {
      const hadServiceWorkerController = Boolean(navigator.serviceWorker?.controller);
      const unregisterServiceWorkers =
        'serviceWorker' in navigator
          ? navigator.serviceWorker.getRegistrations().then(registrations =>
              Promise.all(registrations.map(registration => registration.unregister()))
            )
          : Promise.resolve();
      const clearAppCaches =
        'caches' in window
          ? caches.keys().then(cacheNames =>
              Promise.all(
                cacheNames
                  .filter(cacheName => cacheName.startsWith('prodigital-cache-'))
                  .map(cacheName => caches.delete(cacheName))
              )
            )
          : Promise.resolve();

      Promise.all([unregisterServiceWorkers, clearAppCaches]).then(() => {
        if (hadServiceWorkerController) {
          window.location.reload();
        }
      });
    }
  </script>

  <script type="module" src="/src/index.tsx"></script>

  <!-- Service Worker Registration Script -->
  <script>
    if ('serviceWorker' in navigator && !isLocalDevHost) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/service-worker.js').then(registration => {
          console.log('Service Worker registered: ', registration);
        }).catch(registrationError => {
          console.log('Service Worker registration failed: ', registrationError);
        });
      });
    }
  </script>
</body>

</html>
